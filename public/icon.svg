  <path d="M292 152 Q338 182 384 212" fill="none" stroke="#fef3c7" stroke-width="5" stroke-dasharray="9 6"/>
  <text x="256" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#f5b932" letter-spacing="4">SIXER 3D</text>
